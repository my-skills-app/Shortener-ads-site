<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UG Coders — Copy your access key</title>
  <style>
    :root { --bg:#0a0c10; --card:#11151b; --muted:#9aa3b2; --text:#eaf0f7; --accent:#3b82f6; }
    *{box-sizing:border-box}
    html, body{height:100%;}
    body{margin:0; font-family:system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", Apple Color Emoji, Segoe UI Emoji; color:var(--text); background-color:#07090d; background: radial-gradient(1200px 800px at 10% 10%, #0f172a 0, #0a0c10 50%, #07090d 100%); overflow-x:hidden; -webkit-text-size-adjust:100%; position:relative}
    /* Animated ambient background */
    body::before{content:""; position:fixed; inset:-40%; background:conic-gradient(from 0deg at 50% 50%, #0ea5e9, #3b82f6, #22d3ee, #0ea5e9); filter:blur(140px) saturate(140%); opacity:.12; animation:spin 30s linear infinite; pointer-events:none; z-index:-1}
    @keyframes spin{to{transform:rotate(360deg)}}
    .wrap{min-height:100dvh; display:grid; place-items:center; padding:clamp(16px, 4vw, 32px); padding-left:calc(env(safe-area-inset-left, 0px) + 16px); padding-right:calc(env(safe-area-inset-right, 0px) + 16px); padding-top:calc(env(safe-area-inset-top, 0px) + 16px); padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 16px)}
    .card{width:100%; max-width:820px; background:
      linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
      radial-gradient(120% 120% at 100% 0%, rgba(14,165,233,.08) 0, rgba(59,130,246,.06) 40%, rgba(34,211,238,.05) 70%, transparent 100%);
      border:1px solid rgba(255,255,255,.12); border-radius:22px; padding:clamp(20px, 3.5vw, 36px); box-shadow:0 10px 30px rgba(0,0,0,.35); backdrop-filter: saturate(160%) blur(8px); position:relative; overflow:hidden}
    .card::before{content:""; position:absolute; inset:0; border-radius:22px; padding:1px; background:linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.08), rgba(255,255,255,.04)); -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events:none}
    .card::after{content:""; position:absolute; top:-30%; right:-25%; width:60%; height:80%; background:radial-gradient(60% 60% at 50% 50%, rgba(14,165,233,.12), rgba(59,130,246,.10) 40%, rgba(34,211,238,.08) 70%, transparent 100%); filter:blur(20px); transform:rotate(-15deg); pointer-events:none}
    .card.success{box-shadow:0 0 0 3px rgba(59,130,246,.35), 0 12px 36px rgba(59,130,246,.25)}
    .logo{width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg, #0ea5e9, #3b82f6); display:grid; place-items:center; color:#fff; font-weight:800; letter-spacing:.5px; box-shadow:0 10px 28px rgba(59,130,246,.35); margin:0 auto 10px}
    .logo span{font-size:18px}
    h1{margin:0 0 6px; font-size:clamp(22px, 6vw, 32px); text-align:center; background:linear-gradient(90deg, #f0f9ff, #e0f2fe 50%, #dbeafe); -webkit-background-clip:text; background-clip:text; color:transparent}
    p.sub{margin:0 0 18px; color:var(--muted); text-align:center}
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center}
    .pill{display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid rgba(59,130,246,.25); border-radius:999px; color:var(--muted); font-size:13px}
    .content{margin:18px 0 8px}
    .box{position:relative; width:100%; background:var(--card); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:clamp(14px, 3vw, 20px)}
    .val{white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size:clamp(18px, 2.8vw, 22px); line-height:1.6}
    .actions{display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; justify-content:center}
    button{appearance:none; cursor:pointer; border:0; background:linear-gradient(135deg, #0ea5e9, #3b82f6, #60a5fa); color:#ffffff; padding:clamp(12px, 3vw, 16px) clamp(18px, 5vw, 22px); border-radius:14px; font-weight:800; letter-spacing:.4px; transition:transform .12s ease, box-shadow .2s ease}
    button::after{content:""; position:absolute; inset:0; border-radius:inherit; background:linear-gradient(90deg, rgba(255,255,255,.0) 0%, rgba(255,255,255,.35) 50%, rgba(255,255,255,0) 100%); transform:translateX(-120%); transition:transform .8s ease}
    button{position:relative; overflow:hidden}
    button:hover{transform:translateY(-1px); box-shadow:0 8px 22px rgba(59,130,246,.35)}
    button:hover::after{transform:translateX(120%)}
    button:active{transform:translateY(0)}
    button:focus{outline:none; box-shadow:0 0 0 3px rgba(59,130,246,.45)}
    button.primary{background:linear-gradient(135deg, #2563eb, #0ea5e9)}
    code{background:rgba(255,255,255,.06); padding:3px 6px; border-radius:6px}
    .hidden{display:none}
    @media (max-width: 600px){
      .pill{font-size:12px; padding:5px 8px}
      .val{font-size:clamp(16px, 5vw, 20px)}
      .actions{gap:10px}
      .actions .primary{width:100%; max-width:560px}
      .card{max-width:640px}
    }
    @media (prefers-reduced-motion: reduce){
      *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important}
    }
    @media (max-width: 360px){
      h1{font-size:clamp(18px, 6vw, 22px)}
      .card{padding:16px}
      .box{padding:12px}
      button{padding:12px 14px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo"><span>UG</span></div>
      <h1>UG Coders</h1>
      <p class="sub">Copy your access key</p>
      <div class="row">
        <span class="pill" id="modePill">Detecting…</span>
        <span class="pill" id="lenPill">Length: 0</span>
      </div>

      <div class="content">
        <div class="box">
          <div id="value" class="val">(No parameter found yet)</div>
        </div>
        <div class="actions">
          <button id="copyBtn" class="primary" disabled>Copy</button>
        </div>
      </div>


      
    </div>
  </div>

  <script>
    (function(){
      const valueEl = document.getElementById('value');
      const copyBtn = document.getElementById('copyBtn');
      const modePill = document.getElementById('modePill');
      const lenPill = document.getElementById('lenPill');
      const card = document.querySelector('.card');

      // No example links; simple copy-only interface

      function decodePlus(str){
        // decodeURIComponent but also convert + to spaces for query values
        try { return decodeURIComponent(String(str).replace(/\+/g, ' ')); } catch { return String(str); }
      }

      function getLastQueryParam(search){
        const usp = new URLSearchParams(search);
        let lastKey = null, lastVal = '';
        for (const [k,v] of usp.entries()) { lastKey = k; lastVal = v; }
        if (lastKey === null) return null;
        return { key: lastKey, value: decodePlus(lastVal), mode: 'query' };
      }

      function getLastPathSegment(pathname){
        const parts = String(pathname || '').split('/')
          .filter(Boolean);
        if (!parts.length) return null;
        return { key: '(path)', value: decodePlus(parts[parts.length - 1]), mode: 'path' };
      }

      function pickValue(){
        const q = getLastQueryParam(location.search);
        if (q && q.value) return q;
        const p = getLastPathSegment(location.pathname);
        if (p && p.value) return p;
        return { key: '', value: '', mode: 'none' };
      }

      function render(valObj){
        const { value, mode } = valObj;
        valueEl.textContent = value || '(No parameter found yet)';
        copyBtn.disabled = !value;
        modePill.textContent = mode === 'query' ? 'Mode: Query Param' : mode === 'path' ? 'Mode: Path Segment' : 'Mode: —';
        lenPill.textContent = 'Length: ' + (value ? value.length : 0);
      }

      function flashCard(){
        if (!card) return;
        card.classList.add('success');
        setTimeout(()=> card.classList.remove('success'), 900);
      }

      async function copyToClipboard(text){
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = 'Copied!';
          setTimeout(()=> copyBtn.textContent = 'Copy', 1200);
          flashCard();
        } catch (e) {
          // Fallback
          const ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } finally { document.body.removeChild(ta); }
          copyBtn.textContent = 'Copied!';
          setTimeout(()=> copyBtn.textContent = 'Copy', 1200);
          flashCard();
        }
      }

      copyBtn.addEventListener('click', ()=>{
        const txt = valueEl.textContent || '';
        if (txt && txt !== '(No parameter found yet)') copyToClipboard(txt);
      });

      window.addEventListener('popstate', ()=> render(pickValue()));

      render(pickValue());
    })();
  </script>
</body>
</html>
